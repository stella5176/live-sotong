<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVE 소통판</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="landing">
  <div class="landing-card">
    <div class="brand" style="justify-content:center;font-size:22px"><span class="dot"></span>LIVE 소통판</div>
    <h1>실시간 양방향 소통</h1>
    <p>날씨 기분 체크 · 한 줄 소감 · 워드 클라우드</p>
    <a class="btn primary lg" href="host.html" style="text-decoration:none">🎤 강사로 시작하기 (PC)</a>
    <div class="divider">학습자</div>
    <input class="code-input" id="code" inputmode="numeric" maxlength="6" placeholder="방 코드 6자리" autocomplete="off">
    <button class="btn lg" id="go">📱 참여하기</button>
  </div>
</div>
<script>
  const go = () => { const c = document.getElementById("code").value.replace(/\D/g, ""); if (c.length === 6) location.href = "join.html?room=" + c; };
  document.getElementById("go").onclick = go;
  document.getElementById("code").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
</script>
</body>
</html>
